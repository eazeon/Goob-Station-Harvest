#START SET SELECTION
- type: entity
  id: ChaplainUndeterminedBible
  name: balise scripturale du bluespace
  description: Même si je marche dans la vallée de l'ombre de la mort, je ne craindrai aucun mal, car vous êtes avec moi.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    - ClockworkSet
    - BibleVedaSet
    - VelesBookSet
    - BibleDruidSet
    - BibleCommunistSet
    - BibleSatanicSet
    - BibleNarsieSet
    - BibleNanoTrasenSet
    - BibleHonkSet
    - BibleRatvarSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  name: La sainte Bible
  description: Brisez tout lien, sauf ceux qui m'attachent à votre service et à votre cœur.
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

