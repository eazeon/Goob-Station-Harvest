- type: entity
  name: bible
  description: Nouvelle version interstellaire 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -15
        Burn: -15
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 5 # Goobstation - bro wtf
        Blunt: 1
  #- type: Prayable - no, use the altar
  #  bibleUserOnly: true
  - type: AlternatePrayable # Goobstation
    requireBibleUser: false
  - type: Summonable
    specialItem: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Material
  #  - type: Tag
  #    tags:
  #    - Bible
  - type: StealTarget # Goobstation - fix
    stealGroup: Bible
  - type: EnchantingTool # Goobstation
  - type: StatusEffectOnCollideGhost # Goobstation
    whitelist:
      tags:
      - WeakToSalt
    statusEffect: Corporeal
    duration: 5

- type: entity
  parent: [Bible]
  name: nécronomicon
  description: "Il y a une note : Klatuu, Verata, Nikto -- Ne l'oubliez plus !"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

