- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, DrinkBase, DrinkBaseOpenable ]
  id: DrinkBottlePlasticBaseFull
  suffix: Full
  components:
  - type: Item
    size: Normal
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: Sprite
    sprite: Objects/Consumable/Drinks/generic_jug.rsi # fallback to generic plastic jug
  - type: TrashOnSolutionEmpty
    solution: drink
  - type: Tag
    tags:
    - DrinkBottle # Needed to fit in the soda dispenser, needs a better name
  - type: Construction #Goob content
    graph: MolotovConstruction
    node: start

- type: entity
  abstract: true
  parent: DrinkBottlePlasticBaseFull
  id: DrinkBottlePlasticSmallBaseFull
  components:
  - type: Item
    size: Small
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi # fallback
  - type: FitsInDispenser
    solution: drink

# Empty

- type: entity
  parent: [DrinkVisualsOpenable, DrinkBottlePlasticBaseFull]
  id: CustomDrinkJug
  name: bidon de boisson
  description: Un bidon pour stocker des boissons faites sur mesure.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 150

# Small Plastic Bottles

- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottlePlasticSmallBaseFull]
  id: DrinkWaterBottleFull
  name: bouteille d'eau
  description: Simple eau propre d'origine inconnue. Vous vous dites que peut-être vous ne voulez pas la connaître.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Water
          Quantity: 30
  - type: Sprite
    sprite: Objects/Consumable/Drinks/waterbottle.rsi
  - type: Label
    currentLabel: reagent-name-water
  - type: Sealable # Goobstation
  - type: Tag # Goobstation
    tags:
    - DrinkBottle

