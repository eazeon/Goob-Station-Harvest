# The Modsuit Itself, This is just a ERT modsuit
- type: entity
  parent: [ ClothingModsuitStandard, BaseCentcommContraband ]
  id: ClothingModsuitResponsoryEngineering
  name: "unité de contrôle de combimod Responsory d'Ingénierie"
  description: "Le contrôleur principal d'une combimod Responsory d'Ingénierie."
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/engineering-responsory.rsi
    - type: ModSuit
      theme: ModThemeResponsory
      parts:
        head: ClothingModsuitHelmetResponsoryEngineering
        gloves: ClothingModsuitGauntletsResponsoryEngineering
        outerClothing: ClothingModsuitChestplateResponsoryEngineering
        shoes: ClothingModsuitBootsResponsoryEngineering
      startingModules:
      - ModsuitModuleStorageBluespace
      - ModsuitModuleFlashlight
      - ModsuitModuleMagboots
      inbuiltModules:
      - ModsuitModuleBuiltinSecHud
      - ModsuitModuleBuiltinMedHud
      - ModsuitModuleBuiltinFlashProtection
      - ModsuitModuleBuiltinInsulation
    - type: ItemSlots
      slots:
        mod-core:
          name: modsuit-core-slot-name
          startingItem: ModsuitCoreStandardMicroreactor
          whitelist:
            components:
            - ModCore
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        back:
        - state: equipped-BACKPACK-sealed

- type: entity
  parent: ClothingModsuitGauntletsStandard
  id: ClothingModsuitGauntletsResponsoryEngineering
  name: "gantelets de combimod Responsory d'Ingénierie"
  description: "Une paire de gantelets conçus pour la combimod Responsory d'Ingénierie."
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/engineering-responsory.rsi
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        gloves:
        - state: equipped-HAND-sealed
        - state: equipped-HAND-sealed-unshaded
          shader: unshaded
        gloves-vox:
        - state: equipped-HAND-sealed-vox
        - state: equipped-HAND-sealed-unshaded-vox
          shader: unshaded

- type: entity
  parent: [ClothingModsuitHelmetStandard]
  id: ClothingModsuitHelmetResponsoryEngineering
  name: "casque de combimod Responsory d'Ingénierie"
  description: "Un casque à la pointe de la technologie conçu par NanoTrasen pour la combimod Responsory d'Ingénierie. Il inclut un HUD intégré."
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/engineering-responsory.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.08
      lowPressureMultiplier: 1000
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.75
          Slash: 0.4 # Goobstation - Solstice: CBURN should protect against zombie attacks # pheenty: why tf is ert engineer inherited from cburn
          Piercing: 0.65
          Heat: 0.15
          Cold: 0.10
          Shock: 0.15
          Radiation: 0.1
          Caustic: 0.1
    - type: FlashSoundSuppression # Goobstation
      protectionRange: 0
    - type: PointLight
      color: "#FFDF00"
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        head-hydrakin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-feroxi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-vulpkanin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-resomi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-vox:
        - state: equipped-HEAD-sealed-vox
        - state: equipped-HEAD-sealed-unshaded-vox
          shader: unshaded
    - type: Clothing
      clothingVisuals:
        head-vulpkanin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-feroxi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-hydrakin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
- type: entity
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplateResponsoryEngineering
  name: "plastron de combimod Responsory d'Ingénierie"
  description: "Un plastron à la pointe de la technologie conçu par NanoTrasen pour la combimod Responsory d'Ingénierie. Il intègre des servos motorisés pour réduire la charge de l'équipement."
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/engineering-responsory.rsi
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.3 # Goobstation - CBURN should protect against zombie attacks
          Piercing: 0.6
          Heat: 0.10
          Cold: 0.10
          Shock: 0.15
          Radiation: 0.1
          Caustic: 0.1
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        outerClothing-resomi:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing-vox:
        - state: equipped-OUTERCLOTHING-sealed-vox    
    - type: StaminaResistance
      damageCoefficient: 0.5 # 50%
    - type: FireProtection
      reduction: 1
    - type: ClothingGrantComponent
      component:
        - type: SupermatterImmune

- type: entity
  parent: ClothingModsuitBootsStandard
  id: ClothingModsuitBootsResponsoryEngineering
  name: "bottes de combimod Responsory d'Ingénierie"
  description: "Une paire de magbottes à la pointe de la technologie pour la combimod Responsory d'Ingénierie. Tant que la combinaison est alimentée, celles-ci ne ralentiront pas le porteur."
  categories: [HideSpawnMenu]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _EinsteinEngines/Clothing/NanoTrasen/Modsuits/engineering-responsory.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        shoes:
        - state: equipped-FEET-sealed
        shoes-vox:
        - state: equipped-FEET-sealed-vox
        - state: equipped-FEET-sealed-unshaded-vox
          shader: unshaded
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1

- type: entity
  id: SuitStorageResponsoryEngineering
  parent: SuitStorageBase
  suffix: "Combimod Responsory d'Ingénierie"
  components:
    - type: StorageFill
      contents:
        - id: OxygenTankFilled
        - id: ClothingModsuitResponsoryEngineering
        - id: ClothingMaskBreath
