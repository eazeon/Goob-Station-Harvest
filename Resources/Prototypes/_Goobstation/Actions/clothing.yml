- type: entity
  parent: BaseAction
  id: ActionModSuitActivate
  name : Activer/désactiver le MOD
  description : Verrouillez ou déverrouillez votre MODsuit. Toutes les parties doivent d'abord être déployées.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Actions/modsuit.rsi
      state: activate
  - type: InstantAction
    event: !type:ModSuitActivateActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSuitDeploy
  name: Déployer les parties MOD
  description: Déployer ou rétracter chaque partie de votre MODsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModSuitDeployActionEvent

- type: entity
  parent: BaseAction
  id: ActionModModule
  name: Utiliser le module MOD
  description: Utiliser ou basculer ce module MODsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModModuleActionEvent

- type: entity
  parent: BaseAction
  id: ActionModPowerKick
  name: Coup de pied propulsé
  description: Lancez-vous sur une cible avec un coup de pied dévastateur.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 7
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ModPowerKickActionEvent

- type: entity
  parent: BaseAction
  id: ActionModHydraulicLaunch
  name: Lancement hydraulique
  description: Chargez les bras hydrauliques et propulsez-vous vers une cible.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 10
  - type: EntityTargetAction
    canTargetSelf: false
  - type: WorldTargetAction
    event: !type:ModPowerKickActionEvent

- type: entity
  parent: BaseAction
  id: ActionModMagnet
  name: Aimant hydraulique
  description: Attirez une caisse ou un casier vers vous, ou lancez celui que vous traînez sur une cible.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 7
  - type: WorldTargetAction
    event: !type:ModMagnetActionEvent

- type: entity
  parent: BaseAction
  id: ActionModRecyclerUnload
  name: Vider le recyclage
  description: Vider tout ce que le recyclage a collecté à vos pieds.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:ModRecyclerUnloadActionEvent

- type: entity
  parent: BaseAction
  id: ActionModShootingMode
  name: Changer le mode de tir
  description: Passer l'assistant de tir entre les modes désactivé, stormtrooper et tireur d'élite.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:ModShootingModeActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSelectDevice
  name: Sélectionner l'outil de module
  description: Choisir l'outil déployé par ce module MOD.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: false
  - type: InstantAction
    event: !type:ModSelectDeviceActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSphereMissiles
  name: Lancer les micromissiles
  description: Tirez une volée de micromissiles de minage sur la cible.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Goobstation/Objects/Specific/Robotics/mod_modules.rsi
      state: mine_missile
    useDelay: 3
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: WorldTargetAction
    event: !type:ModSphereMissileActionEvent


- type: entity
  parent: BaseAction
  id: ActionActivateProjector
  name: Basculer le Clone
  description: Génère ou dissipe votre gémeaux connecté.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: default
  - type: InstantAction
    event: !type:CloneProjectorActivatedEvent {}

- type: entity
  parent: BaseAction
  id: ActionHailer
  name: Héler
  description: Hélez audiblement l'équipage proche, utile pour donner des ordres rapides.
  components:
  - type: Action
    icon: { sprite: Clothing/Mask/gassecurity.rsi, state: icon }
  - type: InstantAction
    event: !type:HailerActionEvent
