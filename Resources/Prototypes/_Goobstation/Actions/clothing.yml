- type: entity
  parent: BaseAction
  id: ActionModSuitActivate
  nom : Activer/désactiver le MOD
  description : Verrouillez ou déverrouillez votre MODsuit. Toutes les parties doivent d'abord être déployées.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Actions/modsuit.rsi
      state: activate
  - type: InstantAction
    event: !type:ModSuitActivateActionEvent

- type: entity
  parent: BaseAction
  id: ActionModSuitDeploy
  name: Deploy MOD parts
  description: Deploy or retract every part of your MODsuit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: true
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModSuitDeployActionEvent

- type: entity
  parent: BaseAction
  id: ActionModModule
  name: Use MOD module
  description: Use or toggle this MODsuit module.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ModModuleActionEvent

- type: entity
  parent: BaseAction
  id: ActionModPowerKick
  name: Power kick
  description: Launch yourself at a target with a devastating kick.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigItem
    checkCanInteract: true
  - type: TargetAction
    checkCanAccess: false
    range: 7
  - type: WorldTargetAction
    event: !type:ModPowerKickActionEvent


- type: entity
  parent: BaseAction
  id: ActionActivateProjector
  name: Basculer le Clone
  description: Génère ou dissipe votre gémeaux connecté.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: true
    itemIconStyle: NoItem
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: default
  - type: InstantAction
    event: !type:CloneProjectorActivatedEvent {}

- type: entity
  parent: BaseAction
  id: ActionHailer
  name: Héler
  description: Hélez audiblement l'équipage proche, utile pour donner des ordres rapides.
  components:
  - type: Action
    icon: { sprite: Clothing/Mask/gassecurity.rsi, state: icon }
  - type: InstantAction
    event: !type:HailerActionEvent
