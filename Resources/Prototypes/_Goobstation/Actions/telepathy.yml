- type: entity
  id: ActionTelepathy
  name: Télépathie
  description: Transmet télépathiquement un message à la cible.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    icon:
      sprite: _Goobstation/Actions/actions_revenant.rsi
      state: transmit
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
  - type: TargetAction
    interactOnMiss: false
    range: 15
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:TelepathyWhisperEvent
  - type: TelepathyAction
    popupWhisperFlavor: telepathic-whisper-flavor
