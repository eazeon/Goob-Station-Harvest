- type: entity
  id: DiseaseBehaviorCancer
  parent: DiseaseBehaviorBase
  name: Cancer
  description: Inflige des dégâts génétiques dans le temps.
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Cellular: 0.2

- type: entity
  id: DiseaseBehaviorPoison
  parent: DiseaseBehaviorBase
  name: Poison
  description: Inflige des dégâts de poison dans le temps.
  components:
  - type: DiseaseEffect
    complexity: 20
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Poison: 0.3

- type: entity
  id: DiseaseBehaviorBlunt
  parent: DiseaseBehaviorBase
  name: Dégradation tissulaire
  description: Inflige des dégâts contondants dans le temps.
  components:
  - type: DiseaseEffect
    complexity: 15
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Blunt: 0.5

- type: entity
  id: DiseaseBehaviorNecrosis
  parent: DiseaseBehaviorBase
  name: Nécrose
  description: Dans les stades finals, elle inflige de lourds dégâts de poison et de perte de sang dans le temps.
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Poison: 1.5
          Bloodloss: 5
  - type: DiseaseProgressCondition
    minProgress: 0.8

- type: entity
  id: DiseaseBehaviorPulmonaryEdema
  parent: DiseaseBehaviorBase
  name: Œdème pulmonaire
  description: Inflige des dégâts d'asphyxie dans le temps.
  components:
  - type: DiseaseEffect
    complexity: 14
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Asphyxiation: 3
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorInternalBleeding
  parent: DiseaseBehaviorBase
  name: Hémorragie interne
  description: Dans les stades finals, inflige des dégâts perforants dans le temps et réduit la quantité de sang dans le corps.
  components:
  - type: DiseaseEffect
    complexity: 14
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Piercing: 0.5
    - !type:ModifyBloodLevel
      amount: -8
  - type: DiseaseProgressCondition
    minProgress: 0.8

- type: entity
  id: DiseaseBehaviorAnemia
  parent: DiseaseBehaviorBase
  name: Anémie
  description: Dans les stades finals, inflige de lourds dégâts d'asphyxie dans le temps.
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Asphyxiation: 8
    - !type:ModifyBloodLevel
      amount: -3
  - type: DiseaseProgressCondition
    minProgress: 0.9

- type: entity
  id: DiseaseBehaviorOrganFailure
  parent: DiseaseBehaviorBase
  name: Insuffisance d'organes
  description: Au stade final, il y a une chance de mort instantanée.
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      probability: 0.01
      damage:
        types:
          Bloodloss: 200
  - type: DiseaseProgressCondition
    minProgress: 1

# this is broken and hits the owning entity but i'm leaving it here so someone can fix it
- type: entity
  id: DiseaseBehaviorGunemia
  parent: DiseaseBehaviorBase
  name: Gunémie
  description: Vous fait tousser des balles. Mécanisme inconnu.
  components:
  - type: DiseaseEffect
    complexity: 30
  - type: DiseaseGenericEffect
    component: Gun
    timeScale: false
    defaults:
      FireRate: 0.2
  - type: HTN
    rootTask:
      task: TurretCompound
    blackboard:
      RotateSpeed: !type:Single
        3.141
  - type: CombatMode
    toggleMouseRotator: false
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Gun
    fireRate: 0.1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Voice/Human/male_cough_1.ogg
  - type: BallisticAmmoProvider
    proto: CartridgeCaselessRifle
    capacity: 1000000
