- type: entity
  parent: [ ClothingModsuitStandard, BaseCargoContraband ]
  id: ClothingModsuitLoader
  name: unité de contrôle modsuit chargeur
  description: "Un harnais motorisé expérimental non scellé fabriqué par Scarborough Arms pour une livraison rapide et efficace des munitions."
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/loader.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - back
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      - state: module-hydraulic
  - type: ModSuit
    theme: ModThemeLoader
    parts:
      head: ClothingModsuitHelmetLoader
      gloves: ClothingModsuitGauntletsLoader
      outerClothing: ClothingModsuitChestplateLoader
      shoes: ClothingModsuitBootsLoader
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-sealed
      - state: module-hydraulic
  - type: Construction
    graph: Modsuit
    node: loader
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1

- type: entity
  parent: ClothingModsuitHelmetStandard
  id: ClothingModsuitHelmetLoader
  name: casque modsuit chargeur
  description: Le casque d'un modsuit chargeur. Il couvre le visage, mais n'est pas étanche à l'air.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/loader.rsi
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HEAD
      head-vox:
      - state: equipped-HEAD
      head-vulpkanin:
      - state: equipped-HEAD
      head-feroxi:
      - state: equipped-HEAD
      head-hydrakin:
      - state: equipped-HEAD
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.1
      OrganDamage: 0.1
      BoneDamage: 0.1
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Heat: 0.9
        Caustic: 0.9
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      head:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-resomi:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-vulpkanin:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-feroxi:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
      head-hydrakin:
      - state: equipped-HEAD-sealed
      - state: equipped-HEAD-sealed-unshaded
        shader: unshaded
  - type: ModSealedComponents
    components:
    - type: IdentityBlocker
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
  - type: Tag
    tags:
    - PlasmamanSafe

- type: entity
  parent: ClothingModsuitChestplateStandard
  id: ClothingModsuitChestplateLoader
  name: plastron modsuit chargeur
  description: L'exosquelette en titane d'un modsuit chargeur. Ses jambes actionnées par myomères permettent au porteur de courir à pleine vitesse.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/loader.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    traumaDeductions:
      Dismemberment: 0.1
      OrganDamage: 0.1
      BoneDamage: 0.1
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.95
        Heat: 0.9
        Caustic: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed
  - type: ModSealedComponents
    components: []

- type: entity
  parent: ClothingModsuitGauntletsStandard
  id: ClothingModsuitGauntletsLoader
  name: gantelets modsuit chargeur
  description: Les gantelets d'un modsuit chargeur. Partiellement isolés contre les chocs des bras myomères.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/loader.rsi
  - type: Insulated
    coefficient: 0.25

- type: entity
  parent: ClothingModsuitBootsStandard
  id: ClothingModsuitBootsLoader
  name: bottes modsuit chargeur
  description: Les bottes d'un modsuit chargeur.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/loader.rsi
