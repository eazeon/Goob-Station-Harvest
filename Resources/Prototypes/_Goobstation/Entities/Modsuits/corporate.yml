# The Modsuit Itself, This is just a Deathsquad modsuit, but reskined for CC Officials
- type: entity
  parent: [ ClothingModsuitStandard, BaseCentcommContraband ]
  id: ClothingModsuitCorporate
  name: unité de contrôle de combinaison modulaire Corporate
  description: Le contrôleur principal pour une combinaison modulaire Corporate.
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/corporate.rsi
    - type: ModSuit
      theme: ModThemeCorporate
      parts:
        head: ClothingModsuitHelmetCorporate
        gloves: ClothingModsuitGauntletsCorporate
        outerClothing: ClothingModsuitChestplateCorporate
        shoes: ClothingModsuitBootsCorporate
      startingModules:
      - ModsuitModuleStorageLarge
      - ModsuitModuleFlashlight
      - ModsuitModuleMagboots
      inbuiltModules:
      - ModsuitModuleBuiltinThermal
      - ModsuitModuleBuiltinSecHud
      - ModsuitModuleBuiltinMedHud
      - ModsuitModuleBuiltinFlashProtection
      - ModsuitModuleBuiltinInsulation
      - ModsuitModuleBuiltinAutoInjector
      - ModsuitModuleBuiltinInstrument
      - ModsuitModuleBuiltinGrip
    - type: ItemSlots
      slots:
        mod-core:
          name: modsuit-core-slot-name
          startingItem: ModsuitCoreStandardAntique
          whitelist:
            components:
            - ModCore
    - type: Storage
      grid:
        - 0,0,7,6
    - type: ExplosionResistance
      damageCoefficient: 0.1
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        back:
        - state: equipped-BACKPACK-sealed
        - state: equipped-BACKPACK-sealed-unshaded
          shader: unshaded      

- type: entity
  parent: [ClothingModsuitGauntletsStandard, BaseCentcommContraband]
  id: ClothingModsuitGauntletsCorporate
  name: gantelets de combinaison modulaire Corporate
  description: Une paire de gantelets conçus pour la combinaison modulaire Corporate.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/corporate.rsi
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        gloves:
        - state: equipped-HAND-sealed
        - state: equipped-HAND-sealed-unshaded
          shader: unshaded
        gloves-vox:
        - state: equipped-HAND-sealed-vox
        - state: equipped-HAND-sealed-unshaded-vox
          shader: unshaded

- type: entity
  parent: [ClothingModsuitHelmetStandard, BaseCentcommContraband]
  id: ClothingModsuitHelmetCorporate
  name: casque de combinaison modulaire Corporate
  description: Un casque de pointe conçu par NanoTrasen pour la combinaison modulaire Corporate. Il inclut un HUD intégré.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/corporate.rsi
    - type: Armor
      traumaDeductions: # prevents traumas at all (kinda)
        Dismemberment: 1
        OrganDamage: 1
        BoneDamage: 1
        VeinsDamage: 1
        NerveDamage: 1
      modifiers:
        coefficients:
          Blunt: 0.1 # Best armor in the game - Yeah no shit.
          Slash: 0.1
          Piercing: 0.1
          Heat: 0.1
          Cold: 0.1
          Cellular: 0.1
          Radiation: 0
          Caustic: 0.1
    - type: FlashSoundSuppression # Goobstation
      protectionRange: 0
    - type: PointLight
      color: "#fc8a00"
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        head-hydrakin:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-feroxi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-resomi:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head:
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
        head-vox:
        - state: equipped-HEAD-sealed-vox
        - state: equipped-HEAD-sealed-unshaded-vox
          shader: unshaded
        head-vulpkanin: #TODO: add vulp sprites
        - state: equipped-HEAD-sealed
        - state: equipped-HEAD-sealed-unshaded
          shader: unshaded
    - type: ActivatableUI
      inHandsOnly: false # Goobstation
      singleUser: true
      requireActiveHand: false # Goobstation
      verbText: verb-instrument-openui
      key: enum.InstrumentUiKey.Key
    - type: UserInterface
      interfaces:
        enum.InstrumentUiKey.Key:
          type: InstrumentBoundUserInterface
    - type: ModSealedComponents
      components:
      - type: Instrument
        program: 62
      - type: SwappableInstrument
        instrumentList:
          "Synth": {62: 0}
          "Friend": {2: 0}
          "Overdriven": {29: 0}
          "Bass": {33: 0}
          "Rock": {29: 0}
          "Acoustic": {24: 0}
          "Flute": {73: 0}
          "Sax": {66: 0}
      - type: BreathMask
      - type: PressureProtection
        highPressureMultiplier: 0.3
        lowPressureMultiplier: 1000
      - type: TemperatureProtection
        heatingCoefficient: 0.01
        coolingCoefficient: 0.01
      - type: IdentityBlocker
      - type: IngestionBlocker
        blockSmokeIngestion: True
    - type: Clothing
      clothingVisuals:
        head-vulpkanin:
        - state: equipped-HEAD
        head-feroxi:
        - state: equipped-HEAD
        head-hydrakin:
        - state: equipped-HEAD

- type: entity
  parent: [ClothingModsuitChestplateStandard, BaseCentcommContraband]
  id: ClothingModsuitChestplateCorporate
  name: plastron de combinaison modulaire Corporate
  description: Un plastron de pointe conçu par NanoTrasen pour la combinaison modulaire Corporate. Il incorpore des servos motorisés pour réduire la charge d'équipement.
  categories: [HideSpawnMenu]
  components:
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/corporate.rsi
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: Armor
      traumaDeductions: # prevents traumas at all (kinda)
        Dismemberment: 1
        OrganDamage: 1
        BoneDamage: 1
        VeinsDamage: 1
        NerveDamage: 1
      modifiers:
        coefficients:
          Blunt: 0.1 # Best armor in the game - Yeah no shit.
          Slash: 0.1
          Piercing: 0.1
          Heat: 0.1
          Cold: 0.1
          Cellular: 0.1
          Radiation: 0
          Caustic: 0.1
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        outerClothing-resomi:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
        outerClothing-vox:
        - state: equipped-OUTERCLOTHING-sealed-vox
    - type: StaminaResistance
      damageCoefficient: 0 # 100%
    - type: ExplosionResistance
      damageCoefficient: 0.2
    - type: FireProtection
      reduction: 1
    - type: ClothingGrantComponent
      component:
      - type: SupermatterImmune
      - type: EventHorizonIgnore
        horizonWhitelist:
          tags:
          - Tesla
      - type: ContainmentFieldIgnore
    - type: ModSealedComponents
      components:
      - type: PressureProtection
        highPressureMultiplier: 0.3
        lowPressureMultiplier: 1000
      - type: TemperatureProtection
        coolingCoefficient: 0.01
        heatingCoefficient: 0.01

- type: entity
  parent: [ClothingModsuitBootsStandard, BaseCentcommContraband]
  id: ClothingModsuitBootsCorporate
  name: bottes de combinaison modulaire Corporate
  description: Une paire de magboots de pointe pour la combinaison modulaire Corporate. Tant que la combinaison est alimentée, celles-ci ne ralentiront pas le porteur.
  categories: [HideSpawnMenu]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _Goobstation/Clothing/OuterClothing/Modsuits/corporate.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: ModSuitSealedVisuals
      spriteLayer: sealed
      clothingVisuals:
        shoes:
        - state: equipped-FEET-sealed
        - state: equipped-FEET-sealed-unshaded
          shader: unshaded
        shoes-vox:
        - state: equipped-FEET-sealed-vox
        - state: equipped-FEET-sealed-unshaded-vox
          shader: unshaded
    - type: ModifyStandingUpTime
      multiplier: .25
    - type: ClothingSpeedModifier
      walkModifier: 1.1
      sprintModifier: 1.1

- type: entity
  id: SuitStorageCorporate
  parent: SuitStorageBase
  suffix: Corporate Modsuit
  components:
    - type: StorageFill
      contents:
          - id: OxygenTankFilled
          - id: ClothingModsuitCorporate
          - id: ClothingMaskBreath

- type: entity
  id: ClothingModsuitCorporateFilled
  parent: ClothingModsuitCorporate
  suffix: Rempli
  components:
    - type: StorageFill
      contents:
          - id: BoxSurvivalSlotsEngineering
