# durathread jumpsuit
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitDurathread
  name: uniforme en durafil
  description: Une chemise en durafil ample et usée avec un pantalon gris, ses fibres résilientes offrent une certaine protection au porteur.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/Civilian/durathread_jumpsuit.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Uniforms/Jumpsuit/Civilian/durathread_jumpsuit.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    modifiers:
      coefficients:
        Blunt: 0.85
        Heat: 0.85

