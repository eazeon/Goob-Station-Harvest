- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackStasisBattery
  name: stockage stase
  description: Stocke de l'énergie pour geler le flux temporel, déformant l'espace intérieur pour plus de capacité.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Backpacks/stasis_back.rsi
    state: icon
  - type: Clothing
    slots: BACK
    sprite: _Goobstation/Clothing/Back/Backpacks/stasis_back.rsi
  - type: BasicEntityAmmoProvider
    proto: BulletStasis
    capacity: 1
    count: 1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2.5
    rechargeSound:
      path: /Audio/_Goobstation/Weapons/ChronoLegionnaire/stasisgun_reload.ogg
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,8,5
  - type: Tag
    tags:
    - StasisBattery
    - WhitelistChameleon

- type: entity
  parent: ClothingBackpackStasisBattery
  id: ClothingBackpackStasisBatteryUnremoveable
  suffix: Inamovible
  components:
  - type: Unremoveable

- type: entity
  parent: ClothingBackpackStasisBatteryUnremoveable
  id: ClothingBackpackStasisBatteryUnremoveableFilled
  suffix: Rempli, Inamovible
  components:
  - type: StorageFill
    contents:
      - id: StasisCage
        amount: 4
      - id: MedkitCombatStasiziumFilled
      - id: StasisBaton
      - id: FreedomImplanter
      - id: ScramImplanter
      - id: MindShieldImplanter
      - id: RCDChrono
      - id: ChronoTeleporter
      - id: HandheldGPSBasic # Mass Scanner Removed by Lavaland
      - id: Flash
      - id: TimelineDisruptorFlatpack

- type: entity
  parent: ClothingBackpackMerc
  id: ClothingBackpackMercFilledHECU
  suffix: Rempli, HECU
  components:
  - type: StorageFill
    contents:
      - id: BoxMagazinePistolSubMachineGun
      - id: MindShieldImplanter
      - id: Zipties
      - id: Zipties
      - id: MedkitAdvancedFilled
      - id: WeaponPistolMk58
      - id: Flash

- type: entity
  parent: ClothingBackpackDuffel
  id: ClothingBackpackDuffelGman
  name: sac de sport étrange
  description: Un sac étrange, inamovible, capable de contenir une quantité absurde d'objets. Apparemment invisible à l'œil nu.
  components:
  - type: Sprite
    sprite: Clothing/Back/Duffels/duffel.rsi
    state: icon
  - type: Clothing
    sprite: _Goobstation/Clothing/Armor/covert_armor.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,19,9
  - type: Unremoveable # No looting the gman.

- type: entity
  parent: [Clothing, ClothingSlotBase]
  id: ClothingBackpackLMGBattery
  name: stockage EL-20
  description: Accepte des batteries de voiture spécialisées pour alimenter le LMG EL-20 HAMRR.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Back/Backpacks/lmg_backpack.rsi
    layers:
    - state: icon
      visible: false
    - state: base
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
    zeroNoAmmo: true
  - type: Clothing
    slots: BACK
    sprite: _Goobstation/Clothing/Back/Backpacks/lmg_backpack.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      - state: green-equipped-BACKPACK
        shader: unshaded
      - state: mag-equipped-BACKPACK
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Chargeur
        whitelist:
          tags:
          - MilitaryPowerCellLMG
      item:
        name: LMG
        priority: 2
        startingItem: WeaponLaserLMG
        whitelist:
          tags:
          - LaserLMG
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      item: !type:ContainerSlot
  - type: Item
    size: Ginormous
  - type: Tag
    tags:
    - LaserLMGBackpack
    - WhitelistChameleon
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier

# Assmos - Extinguisher Nozzle
- type: entity
  parent: Clothing
  id: ClothingBackpackFirefighterTank
  name: sac à dos de pompier avec réservoir d'eau
  description: Un sac à dos avec réservoir d'eau réfrigéré qui peut changer de mode pour lancer de la résine ATMOS ou fonctionner comme un extincteur haute pression.
  components:
  - type: Tag
    tags:
    - AtmosBackTank
    - WhitelistChameleon
  - type: Sprite
    sprite: Clothing/Back/Backpacks/atmosbackpacktank.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: BACK
    sprite: Clothing/Back/Backpacks/atmosbackpacktank.rsi
  - type: SolutionAmmoProvider
    solutionId: tank
    proto: AtmosResin
    fireCost: 25
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1200
        reagents:
        - ReagentId: Water
          Quantity: 1200
  - type: DrawableSolution
    solution: tank
  - type: DrainableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: ItemSlots
    slots:
      nozzle_slot:
        name: FirefighterNozzle
        startingItem: FirefighterNozzle
        whitelist:
          tags:
          - Nozzle
  - type: FirefighterTankRefillable
  - type: ContainerContainer
    containers:
      nozzle_slot: !type:ContainerSlot
