- type: entity
  parent: BaseStructure
  id: BaseAutosurgeon
  description: Un auto-chirurgien à usage unique pour remplacer ou améliorer vos parties avec des implants cybernétiques. Déchirez cette station et faites-en une partie de vous.
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Devices/autosurgeon.rsi
    state: icon
    noRot: true
  - type: Item
    size: Huge
  - type: ItemToggle
    onUse: false
  - type: DoAfter
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.05"
        density: 190
        mask:
        - TableMask
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: 0.05,-0.15
  - type: Transform
    anchored: false
    noRot: true
  - type: Anchorable
  - type: Pullable

- type: entity
  parent: BaseAutosurgeon
  id: BaseAutosurgeonSingle
  description: Un auto-chirurgien à usage unique pour remplacer ou améliorer vos parties avec des implants cybernétiques. Déchirez cette station et faites-en une partie de vous.
  abstract: true
  components:
  - type: AutoSurgeon

- type: entity
  parent: BaseAutosurgeon
  id: BaseAutosurgeonMultiple
  description: Un auto-chirurgien à usage unique pour remplacer ou améliorer vos parties avec des implants cybernétiques. Déchirez cette station et faites-en une partie de vous.
  abstract: true
  components:
  - type: AutoSurgeonMultiple

- type: entity
  parent: [BaseAutosurgeonSingle, BaseSyndicateContraband]
  id: BaseAutosurgeonSyndicateSingle
  abstract: true
  components:
  - type: Sprite
    state: icon-syndie

- type: entity
  parent: [BaseAutosurgeonMultiple, BaseSyndicateContraband]
  id: BaseAutosurgeonSyndicateMultiple
  abstract: true
  components:
  - type: Sprite
    state: icon-syndie

# CREW (currently not used, use for testing purposes admeme etc.)

- type: entity
  parent: BaseAutosurgeonSingle
  id: AutosurgeonRightSpeedLeg
  name: autochirurgien (jambe droite S.P.E.E.D)
  components:
  - type: AutoSurgeon
    targetBodyPart: Groin
    newPartProto: SpeedRightLeg

- type: entity
  parent: BaseAutosurgeonSingle
  id: AutosurgeonLeftSpeedLeg
  name: autochirurgien (jambe gauche S.P.E.E.D)
  components:
  - type: AutoSurgeon
    targetBodyPart: Groin
    newPartProto: SpeedLeftLeg

# SYNDICATE

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonRightMantisBlade
  name: autochirurgien du syndicat (lame de mante droite)
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: MantisBladeArm

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonLeftMantisBlade
  name: autochirurgien du syndicat (lame de mante gauche)
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: MantisBladeArm

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonSandevistan
  name: autochirurgien du syndicat (sandevistan)
  components:
  - type: AutoSurgeon
    targetBodyPart: Chest
    targetOrgan: Skibidi
    newPartProto: OrganHeartSandevistan

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonStatvekaSandevistan
  name: autochirurgien du syndicat (sandevistan statveka)
  components:
  - type: AutoSurgeon
    targetBodyPart: Chest
    targetOrgan: Skibidi
    newPartProto: OrganHeartStatvekaSandevistan

- type: entity
  parent: BaseAutosurgeonSyndicateMultiple
  id: AutosurgeonSmartLink
  name: autochirurgien du syndicat (bras smartlink)
  components:
  - type: AutoSurgeonMultiple
    entries:
    - targetBodyPart: Arm
      targetBodyPartSymmetry: Right
      newPartProto: SmartlinkRightHand
    - targetBodyPart: Arm
      targetBodyPartSymmetry: Left
      newPartProto: SmartlinkLeftHand

    - targetBodyPart: Arm
      targetBodyPartSymmetry: Right
      componentsToPart:
      - type: SmartLinkArm
    - targetBodyPart: Arm
      targetBodyPartSymmetry: Left
      componentsToPart:
      - type: SmartLinkArm

- type: entity
  parent: BaseAutosurgeonSyndicateMultiple
  id: AutosurgeonRecoilAbsorber
  name: autochirurgien du syndicat (bras absorbant le recul)
  components:
  - type: AutoSurgeonMultiple
    entries:
    - targetBodyPart: Arm
      targetBodyPartSymmetry: Right
      newPartProto: RecoilAbsorberRightHand
    - targetBodyPart: Arm
      targetBodyPartSymmetry: Left
      newPartProto: RecoilAbsorberLeftHand

    - targetBodyPart: Arm
      targetBodyPartSymmetry: Right
      componentsToPart:
      - type: RecoilAbsorberArm
    - targetBodyPart: Arm
      targetBodyPartSymmetry: Left
      componentsToPart:
      - type: RecoilAbsorberArm

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonBerserker
  name: autochirurgien du syndicat (cœur de berserker)
  components:
  - type: AutoSurgeon
    targetBodyPart: Chest
    targetOrgan: heart
    newPartProto: SyndicateBerserkerHeart

- type: entity
  parent: BaseAutosurgeonSyndicateSingle
  id: AutosurgeonJumpstarter
  name: autochirurgien du syndicat (cœur jumpstarter)
  components:
  - type: AutoSurgeon
    targetBodyPart: Chest
    targetOrgan: heart
    newPartProto: SyndicateJumpstarterHeart
