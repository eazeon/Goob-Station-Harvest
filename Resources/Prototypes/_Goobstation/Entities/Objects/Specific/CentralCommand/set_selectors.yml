# Blueshield

- type: entity
  id: BlueshieldUndeterminedWeapon
  name: pack d'équipements bouclier bleu
  description: Une petite boîte utilisant la technologie bluespace pour déposer un équipement directement sur vous. Choisissez judicieusement.
  parent: [ BaseItem, BaseSetSelector, BaseCentcommContraband ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/blueshieldundetermined.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BSOBlueshieldSet
    - BSORevolverSet
    - BSOCQCSet
    - BSOChesterSet
    - BSOSyringeSet
    maxSelectedSets: 2

