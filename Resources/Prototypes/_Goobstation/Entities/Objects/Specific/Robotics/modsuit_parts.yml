- type: entity
  id: ModsuitCoreStandard
  parent: PartModsuit
  name: noyau standard MOD
  description : Source d'énergie interne destinée à un dispositif modulaire de vêtement d'extérieur, conçue autour d'un cristal piézoélectrique rare.
  components:
  - type: Sprite
    state: mod-core-standard
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: PhysicalComposition
    materialComposition:
      Plasma: 50
      Glass: 25
  - type: ModCore
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        whitelist:
          components:
          - PowerCell
        blacklist:
          components:
          - BatterySelfRecharger
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
      cell_slot: !type:ContainerSlot

- type: entity
  parent: ModsuitCoreStandard
  id: ModsuitCoreStandardHighCapacity
  suffix: Batterie haute capacité
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        whitelist:
          components:
          - PowerCell
        blacklist:
          components:
          - BatterySelfRecharger

- type: entity
  parent: ModsuitCoreStandard
  id: ModsuitCoreStandardHyper
  suffix: Batterie surcapacité
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
        whitelist:
          components:
          - PowerCell
        blacklist:
          components:
          - BatterySelfRecharger

- type: entity
  parent: PartModsuit
  id: ModsuitCoreStandardMicroreactor
  name: cœur de microréacteur MOD
  description: Un noyau MOD scellé construit autour d'un mini-réacteur. Il détient une charge modeste qui se régénère lentement d'elle-même.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#7dffb0"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: ModCore
  - type: Battery
    maxCharge: 1080
    startingCharge: 1080
  - type: BatterySelfRecharger
    autoRechargeRate: 3
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
      Uranium: 25
  - type: StaticPrice
    price: 150

- type: entity
  parent: PartModsuit
  id: ModsuitCoreStandardAntique
  name: cœur MOD antique
  description: Un vieux noyau MOD scellé remarquablement bien construit. Il détient une grande charge et se régénère lentement d'elle-même.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#e8c27a"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: ModCore
  - type: Battery
    maxCharge: 1440
    startingCharge: 1440
  - type: BatterySelfRecharger
    autoRechargeRate: 4
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Glass: 200
  - type: StaticPrice
    price: 200

- type: entity
  parent: PartModsuit
  id: ModsuitCorePlasma
  name: cœur de plasma MOD
  description: Tentative de Nanotrasen de capitaliser sur sa recherche sur le plasma. Ces cœurs de plasma sont rechargés en injectant des feuilles de plasma directement dans la combinaison, bien qu'ils détiennent moins de charge qu'un cœur standard.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#d07bff"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: ModCore
  - type: Battery
    maxCharge: 720
    startingCharge: 720
  - type: ModCoreRefuelable
    fuel:
      tags:
      - SheetPlasma
    chargePerFuel: 180
  - type: PhysicalComposition
    materialComposition:
      Plasma: 100
      Glass: 25
  - type: StaticPrice
    price: 75

- type: entity
  parent: PartModsuit
  id: ModsuitCoreInfinite
  name: cœur MOD infini
  suffix: Mèmemémo
  description: Un cœur à fusion utilisant le rare Fixium pour maintenir suffisamment d'énergie pour la durée de vie de l'utilisateur du MOD.
  components:
  - type: Sprite
    state: mod-core-standard
    color: "#7bffe1"
  - type: Icon
    state: mod-core-standard
  - type: Tag
    tags:
    - ModsuitPart
    - ModsuitCore
  - type: ModCore
  - type: Battery
    maxCharge: 1000000
    startingCharge: 1000000
  - type: BatterySelfRecharger
    autoRechargeRate: 1000
