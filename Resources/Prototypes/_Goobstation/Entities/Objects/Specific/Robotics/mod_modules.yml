- type: entity
  abstract: true
  parent: BaseItem
  id: BaseModsuitModule
  name: module MOD
  description: Un module pour une combinaison modulaire.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Robotics/mod_modules.rsi
    state: module
  - type: Item
    size: Normal
  - type: ModModule
  - type: Tag
    tags:
    - ModsuitModule
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleStorage
  components:
  - type: Sprite
    state: storage
  - type: ModModule
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleStorage

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageCompact
  name: module de stockage compact MOD
  description: Une série de compartiments de stockage intégrés et de poches spécialisées installés sur la surface de la combinaison, utile pour stocker divers bricoles.
  components:
  - type: ModModule
    complexity: 1
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,5,3
      maxItemSize: Normal

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageLarge
  name: module de stockage MOD
  description: Système de compartiments cachés entièrement intégré à la combinaison, distribuant objets et poids de manière égale pour une expérience confortable pour l'utilisateur ; que ce soit pour la contrebande, ou simplement pour le transport.
  components:
  - type: Sprite
    state: storage_large
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,1,3
      - 3,0,6,3
      - 8,0,9,3
      maxItemSize: Huge

- type: entity
  parent: [BaseModsuitModuleStorage, BaseSyndicateContraband]
  id: ModsuitModuleStorageSyndicate
  name: module de stockage syndicat MOD
  description: Système de stockage utilisant la nanotechnologie développée par Cybersun Industries, ces compartiments utilisent une technologie ésotérique pour compresser la matière physique des objets placés à l'intérieur, rétrécissant essentiellement les objets pour un stockage beaucoup plus facile et portable.
  components:
  - type: Sprite
    state: storage_syndi
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,9,3
      maxItemSize: Huge

- type: entity
  parent: BaseModsuitModuleStorage
  id: ModsuitModuleStorageBluespace
  name: module de stockage bluespace MOD
  description: Système de stockage développé par Nanotrasen, ces compartiments emploient des poches de bluespace miniaturisées pour la technologie de stockage ultime ; quel que soit le poids des objets placés à l'intérieur.
  components:
  - type: Sprite
    state: storage_bluespace
  - type: ModModule
    complexity: 3
    allowFlags: Inactive
    incompatible:
      tags:
      - ModsuitModuleStorage
  - type: ModStorageModule
    components:
    - type: Storage
      grid:
      - 0,0,11,5
      maxItemSize: Huge

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleFlashlight
  name: module de lampe de poche MOD
  description: Une simple paire de lampes de poche configurables installées sur les côtés gauche et droit du casque, utile pour fournir de la lumière dans une variété de portées et de couleurs.
  components:
  - type: Sprite
    state: flashlight
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.4
    requiredParts:
    - head
  - type: ModLightModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMagboots
  name: module de stabilité magnétique MOD
  description: Ce sont de puissants électroaimants installés dans les bottes de la combinaison, offrant une excellente adhérence quelles que soient les conditions à l'intérieur, et permettant essentiellement de s'accrocher à l'extérieur d'une coque.
  components:
  - type: Sprite
    state: magnet
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.4
    requiredParts:
    - shoes
    incompatible:
      tags:
      - ModsuitModuleGravity
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleGravity
  - type: ModGrantComponentsModule
    slot: shoes
    toggleItem: true
    components:
    - type: ItemToggle
      onUse: false
      onActivate: false
    - type: Magboots
      enabledPrefix: null
    - type: NoSlip
  - type: ModSpeedModule
    walkModifier: 0.85
    sprintModifier: 0.85

- type: entity
  parent: ModsuitModuleMagboots
  id: ModsuitModuleMagbootsAdvanced
  name: "module de stabilité magnétique avancé MOD"
  description: "Ce sont de puissants électroaimants installés dans les bottes de la combinaison, offrant une excellente adhérence quelles que soient les conditions à l'intérieur, et permettant essentiellement de s'accrocher à l'extérieur d'une coque."
  components:
  - type: ModModule
    moduleType: Toggle
    complexity: 3
    activePower: 0.6
    requiredParts:
    - shoes
    incompatible:
      tags:
      - ModsuitModuleGravity
  - type: ModSpeedModule
    walkModifier: 1
    sprintModifier: 1

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleVisor
  components:
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.2
    requiredParts:
    - head
    incompatible:
      tags:
      - ModsuitModuleVisor
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleVisor

- type: entity
  parent: BaseModsuitModuleVisor
  id: ModsuitModuleVisorMedical
  name: module de viseur médical MOD
  description: Un affichage tête haute installé dans le viseur de la combinaison. Celui-ci croise les données des capteurs de la combinaison avec une suite moderne de balayage biologique, permettant à l'utilisateur de visualiser la santé actuelle des formes de vie organiques.
  components:
  - type: Sprite
    state: medhud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
    - type: ShowHealthIcons
    - type: ShowDiseaseIcons

- type: entity
  parent: [BaseModsuitModuleVisor, BaseSecurityContraband]
  id: ModsuitModuleVisorSecurity
  name: module de viseur de sécurité MOD
  description: Un affichage tête haute installé dans le viseur de la combinaison. Ce module est un système de ciblage lourdement rétrofité, branché sur diverses bases de données criminelles pour pouvoir consulter les dossiers d'arrestation, commander des robots simples orientés sécurité, et généralement savoir qui abattre.
  components:
  - type: Sprite
    state: sechud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails

- type: entity
  parent: BaseModsuitModuleVisor
  id: ModsuitModuleVisorDiagnostic
  name: module de viseur de diagnostic MOD
  description: Un affichage tête haute installé dans le viseur de la combinaison. Celui-ci utilise une série de capteurs avancés pour accéder aux données de machines avancées, d'exosquelettes et d'autres appareils, permettant à l'utilisateur de visualiser les niveaux de puissance et l'intégrité actuels de ceux-ci.
  components:
  - type: Sprite
    state: diaghud_visor
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleWelding
  name: module de protection contre le soudage MOD
  description: Un module installé dans le viseur de la combinaison, qui projette une superposition holographique polarisée devant les yeux de l'utilisateur. Il est classé suffisamment haut pour l'immunité contre des extrémités telles que le soudage par points et à l'arc, les éclipses solaires, et les lampes de poche portatives.
  components:
  - type: Sprite
    state: welding
  - type: ModModule
    complexity: 1
    idlePower: 0.1
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: EyeProtection

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleDevice
  components:
  - type: ContainerContainer
    containers:
      mod-device: !type:ContainerSlot

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleHealthAnalyzer
  name: module d'analyseur de santé MOD
  description: Un module installé dans le gant de la combinaison. Il s'agit d'une suite de balayage biologique high-tech, permettant à l'utilisateur d'obtenir des informations approfondies sur les signes vitaux et les blessures des autres, même à distance.
  components:
  - type: Sprite
    state: health
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceHealthAnalyzer

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleGps
  name: module GPS interne MOD
  description: Ce module utilise la technologie commune de Nanotrasen pour calculer la position de l'utilisateur n'importe où dans l'espace, jusqu'aux coordonnées exactes.
  components:
  - type: Sprite
    state: gps
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
  - type: ModDeviceModule
    device: ModsuitDeviceGps

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleJetpack
  name: module de réacteur à ions MOD
  description: Une série de propulseurs électriques installés à travers la combinaison, ce module est très attendu par les stagiaires Ingénieurs. Plutôt que d'utiliser des gaz pour la poussée de combustion, ces jets sont capables d'accélérer des ions en utilisant la charge de la combinaison.
  components:
  - type: Sprite
    state: jetpack
  - type: Appearance
  - type: ModModule
    moduleType: Toggle
    complexity: 3
    activePower: 20
    requiredParts:
    - outerClothing
    incompatible:
      tags:
      - ModsuitModuleJetpack
  - type: Jetpack
  - type: ModJetpackModule
  - type: Tag
    tags:
    - ModsuitModule
    - ModsuitModuleJetpack

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleThermalRegulator
  name: module de régulateur thermique MOD
  description: Contrôle climatique avancé, utilisant un gant corporel intérieur entrelacé avec des milliers de minuscules lignes de refroidissement flexibles. Celui-ci fait circuler du liquide de refroidissement à diverses températures contrôlées par l'utilisateur, assurant leur confort.
  components:
  - type: Sprite
    state: regulator
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 1.2
  - type: ModThermalRegulatorModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleEmpShield
  name: module de bouclier EMP MOD
  description: Un inhibiteur de champ installé dans la combinaison, la protégeant contre les rétroactions telles que les impulsions électromagnétiques qui endommageraient autrement les systèmes électroniques de la combinaison.
  components:
  - type: Sprite
    state: empshield
  - type: ModModule
    complexity: 1
    idlePower: 0.2
  - type: ModEmpShieldModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleMouthhole
  name: module d'appareil de consommation MOD
  description: Un favori chez les Mineurs, cette modification du casque utilise une barrière de nanotechnologie devant la bouche pour permettre de manger et de boire tout en conservant la protection et l'atmosphère.
  components:
  - type: Sprite
    state: apparatus
  - type: ModModule
    complexity: 1
    requiredParts:
    - head
  - type: ModMouthholeModule

- type: entity
  parent: HandheldHealthAnalyzer
  id: ModsuitDeviceHealthAnalyzer
  name: analyseur de santé MOD
  categories: [ HideSpawnMenu ]

- type: entity
  parent: HandheldGPSBasic
  id: ModsuitDeviceGps
  name: GPS MOD
  categories: [ HideSpawnMenu ]
  components:
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  abstract: true
  parent: BaseModsuitModule
  id: BaseModsuitModuleBuiltin
  components:
  - type: ModModule
  - type: PhysicalComposition
    materialComposition: {}

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinThermal
  name: viseur thermique intégré
  description: Imagerie thermique intégrée au viseur du casque, permettant au porteur de voir les signatures thermiques des êtres vivants à travers les murs.
  components:
  - type: Sprite
    state: thermal_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.8
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ThermalVision
      isEquipment: true
      isActive: true
      lightRadius: 15

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinNightVision
  name: vision nocturne intégrée
  description: Amplification de la lumière intégrée au viseur du casque, permettant au porteur de voir dans le noir.
  components:
  - type: Sprite
    state: night_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.4
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: NightVision
      isEquipment: true
      isActive: true

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinSecHud
  name: viseur de sécurité intégré
  description: Un affichage tête haute de sécurité intégré au casque, affichant le poste, le bouclier mental et le casier judiciaire.
  components:
  - type: Sprite
    state: sechud_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.2
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinMedHud
  name: viseur médical intégré
  description: Un affichage tête haute médical intégré au casque, affichant la santé de ceux qui vous entourent.
  components:
  - type: Sprite
    state: medhud_visor
  - type: ModModule
    moduleType: Toggle
    activePower: 0.2
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: ShowHealthBars
    - type: ShowHealthIcons

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinFlashProtection
  name: protection contre les éclairs intégrée
  description: Le viseur du casque est polarisé contre les éclairs et les arcs de soudage tant que la combinaison est active.
  components:
  - type: Sprite
    state: welding
  - type: ModModule
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: FlashImmunity
    - type: EyeProtection

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinInsulation
  name: gantelets isolés
  description: Les gantelets sont doublés d'un isolant, protégeant le porteur des chocs électriques même lorsque la combinaison est éteinte.
  components:
  - type: Sprite
    state: module
  - type: ModModule
    allowFlags: Inactive
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    slot: gloves
    components:
    - type: Insulated

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinAutoInjector
  name: auto-injecteur intégré
  description: Un auto-injecteur d'urgence intégré au plastron. Il dose le porteur avec de la médecine de combat lorsqu'il tombe en état critique.
  components:
  - type: Sprite
    state: injector
  - type: ModModule
    requiredParts:
    - outerClothing
  - type: ModGrantComponentsModule
    slot: outerClothing
    components:
    - type: ClothingAutoInject
      reagents:
        Epinephrine: 10
        Bicaridine: 10
        TranexamicAcid: 5
        Tramadol: 5

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinChameleon
  name: projecteur caméléon
  description: Un projecteur holographique qui permet à l'unité de contrôle de se déguiser en un autre sac à dos.
  components:
  - type: Sprite
    state: chameleon
  - type: ModModule
    moduleType: Usable
    allowFlags: Inactive
  - type: ModOpenUiModule
    key: enum.ChameleonUiKey.Key

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinInstrument
  name: synthétiseur intégré
  description: Un minuscule synthétiseur intégré au casque, pour quand le travail devient ennuyeux.
  components:
  - type: Sprite
    state: bikehorn
  - type: ModModule
    moduleType: Usable
    requiredParts:
    - head
  - type: ModOpenUiModule
    key: enum.InstrumentUiKey.Key
    slot: head

- type: entity
  parent: BaseModsuitModuleBuiltin
  id: ModsuitModuleBuiltinGrip
  name: prise renforcée
  description: Des servos dans les gantelets donnent au porteur une prise en fer lorsqu'il attrape les autres.
  components:
  - type: Sprite
    state: clamp
  - type: ModModule
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    slot: gloves
    components:
    - type: GrabModifier
      grabEscapeModifier: -0.1
      grabEscapeMultiplier: 0.8
      grabMoveSpeedMultiplier: 2
      startingGrabStage: Hard

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleQuickCarry
  name: module de port rapide MOD
  description: Une suite de servos avancés, redirigeant l'énergie des bras de la combinaison pour aider à transporter les blessés ; ou simplement pour s'amuser. Cependant, Nanotrasen a verrouillé la capacité du module à aider au combat corps à corps.
  components:
  - type: Sprite
    state: carry
  - type: ModModule
    complexity: 1
    idlePower: 0.1
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    target: Wearer
    components:
    - type: ModQuickCarry
      multiplier: 0.4

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleInjector
  name: module injecteur MOD
  description: Un module installé au poignet de la combinaison, fonctionnant comme une seringue à grande capacité, avec une pointe assez fine pour localiser les ports d'injection d'urgence sur n'importe quelle combinaison de blindage.
  components:
  - type: Sprite
    state: injector
  - type: ModModule
    moduleType: Active
    complexity: 1
    activePower: 0.2
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceInjector

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleDefibrillator
  name: module de défibrillateur MOD
  description: Un module intégré dans les gantelets de la combinaison ; communément connu sous le nom de 'Mains Guérisseuses' par les professionnels de santé. Les ordinateurs de bord de la combinaison calculent la tension nécessaire, et le porteur retourne à l'infirmerie en héros.
  components:
  - type: Sprite
    state: defibrillator
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 1.2
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceDefibrillator

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModulePatientTransport
  name: module de transport de patient MOD
  description: Un module intégré dans l'avant-bras de la combinaison. Invoquable d'un simple geste, le sac de transport en dur-lumière maintient un patient en stase, mais ne tient que tant que le porteur le traîne.
  components:
  - type: Sprite
    state: patient_transport
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.8
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDevicePatientTransport

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleThreadRipper
  name: module de déchireur de fil MOD
  description: Un module qui déchire et recout le tissu des vêtements d'un patient selon les besoins, permettant au porteur d'opérer sans les dévêtir d'abord.
  components:
  - type: Sprite
    state: thread_ripper
  - type: ModModule
    moduleType: Toggle
    complexity: 2
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModGrantComponentsModule
    target: Wearer
    components:
    - type: SurgeryIgnoreClothing

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleTRay
  name: module de scan T-ray MOD
  description: Un module installé dans le viseur de la combinaison, permettant à l'utilisateur d'utiliser une impulsion de radiation térahertz pour essentiellement écholocaliser les choses sous le sol, principalement des câbles et des tuyaux.
  components:
  - type: Sprite
    state: tray
  - type: ModModule
    moduleType: Toggle
    complexity: 1
    activePower: 0.4
    requiredParts:
    - head
  - type: ModGrantComponentsModule
    slot: head
    components:
    - type: TrayScanner
      enabled: true
  - type: ModTrayScannerModule

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleRadProtection
  name: module de protection contre les radiations MOD
  description: Un module utilisant des polymères et un blindage réfléchissant pour protéger l'utilisateur contre les radiations ionisantes.
  components:
  - type: Sprite
    state: radshield
  - type: ModModule
    complexity: 2
    idlePower: 0.2
  - type: ModArmorModule
    modifiers:
      coefficients:
        Radiation: 0.2

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleHeadProtector
  name: module de protection de la tête MOD
  description: Une série de plaques amortissantes installée le long de l'arrière et de l'intérieur du casque, protégeant le porteur des débris qui tombent et de l'instrument contondant occasionnel.
  components:
  - type: Sprite
    state: module
  - type: ModModule
    complexity: 1
    requiredParts:
    - head
  - type: ModArmorModule
    slots:
    - head
    modifiers:
      coefficients:
        Blunt: 0.9

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleTether
  name: module de câble d'urgence MOD
  description: Un grappin sur mesure alimenté par un treuil capable de hisser l'utilisateur. Bien que certains modèles anciens de grappins orientés cargaison aient des capacités de quelques tonnes, ceux-ci ne sont capables de fonctionner que dans des environnements en apesanteur, une bénédiction pour certains Ingénieurs.
  components:
  - type: Sprite
    state: tether
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceTether

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleMister
  name: module de brumisateur d'eau MOD
  description: Un module contenant un brumisateur, capable de pulvériser de l'eau pour éteindre les incendies. Se remplit lentement depuis le réservoir interne de la combinaison.
  components:
  - type: Sprite
    state: mister
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.4
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceMister

- type: entity
  parent: BaseModsuitModuleDevice
  id: ModsuitModuleResinMister
  name: module de brumisateur de résine MOD
  description: Un lanceur de résine atmosphérique qui tire des globes de mousse métallique à prise rapide, colmatant les brèches à distance de sécurité.
  components:
  - type: Sprite
    state: mister
    color: "#c0d6e8"
  - type: ModModule
    moduleType: Active
    complexity: 2
    activePower: 0.8
    requiredParts:
    - gloves
  - type: ModDeviceModule
    device: ModsuitDeviceResinMister

- type: entity
  parent: BaseModsuitModule
  id: ModsuitModuleHolster
