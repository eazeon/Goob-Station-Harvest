- type: entity
  name: pizza coton flamin hot
  parent: FoodPizzaBase
  id: FoodPizzaCottonHot
  description: Pâte plate en coton tissu avec garniture coton super épicée. Flamin hot !
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - bread
    - spicy
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/cotton-pizza-hot.rsi
    state: cotton-pizza-hot
  - type: Edible
    requiresSpecialDigestion: true
  - type: SliceableFood
    slice: FoodPizzaCottonHotSlice
  - type: Tag
    tags:
    - ClothMade
    - Pizza
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: Vitamin
          Quantity: 5
        - ReagentId: Fiber
          Quantity: 5
        - ReagentId: CapsaicinOil
          Quantity: 5

- type: entity
  name: tranche de pizza coton flamin hot
  parent: FoodPizzaSliceBase
  id: FoodPizzaCottonHotSlice
  description: Une tranche de pizza coton chaude. Extra épicée !
  components:
  - type: FlavorProfile
    flavors:
    - cotton
    - bread
    - spicy
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/cotton-pizza-hot.rsi
    state: cotton-slice-hot
  - type: Item
    heldPrefix: cotton-slice-hot
  - type: Tag
    tags:
    - ClothMade
    - Pizza
    - Slice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 3.5
        - ReagentId: Vitamin
          Quantity: 0.8
        - ReagentId: Fiber
          Quantity: 1
        - ReagentId: CapsaicinOil
          Quantity: 0.5
