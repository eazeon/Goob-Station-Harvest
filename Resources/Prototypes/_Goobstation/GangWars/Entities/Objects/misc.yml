- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: Quickhack
  name: quickhack
  description: Un dispositif covert qui simule les signaux d'ouverture d'IA pour déverrouiller les portes non verrouillées. Livré avec 5 charges.
  components:
  - type: Quickhack
  - type: UseDelay
    delay: 1
  - type: LimitedCharges
    maxCharges: 5
  - type: Sprite
    sprite: _Goobstation/Gangs/quickhack.rsi
    state: icon
  - type: Item
    sprite: _Goobstation/Gangs/quickhack.rsi
  - type: Appearance
  - type: StaticPrice
    price: 800

- type: entity
  parent: [EncryptionKey, BaseMajorContraband]
  id: EncryptionKeyGang
  name: clé de chiffrement de gang
  suffix: Gang
  description: Une clé de chiffrement utilisée pour communiquer avec les gangs.
  components:
  - type: EncryptionKey
    channels:
    - Gang
    defaultChannel: Gang
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

- type: entity
  id: GangSprayCan
  name: bombe de peinture de gang
  suffix: Gang
  description: Une bombe de peinture utilisée pour marquer le territoire de ton gang. Ne fonctionne que si tu appartiens à un gang.
  parent: [BaseItem, BaseMinorContraband]
  components:
  - type: Sprite
    sprite: _Goobstation/Gangs/spray_cans.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _Goobstation/Gangs/spray_cans.rsi
    size: Small
  - type: Appearance
  - type: GangSprayCan
  - type: LimitedCharges
    maxCharges: 5

