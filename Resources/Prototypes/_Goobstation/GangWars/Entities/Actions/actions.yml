# Gang member action: toggle territory overlay
- type: entity
  id: ActionGangMemberToggleOverlay
  name: Basculer la Vision
  description: Basculer votre vision de territoire.
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 1
    itemIconStyle: BigAction
    icon: { sprite: _Goobstation/Gangs/actions.rsi, state: toggle_overlay }
  - type: InstantAction
    event: !type:GangMemberToggleOverlayEvent

# Gang Leader action: summon / relocate personal gang locker
- type: entity
  id: ActionGangLeaderSummonLocker
  name: Invoquer le Casier
  description: Invoque ton casier de gang. S'il est déjà placé, le déplace à la place.
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 900 # 15 minutes
    itemIconStyle: BigAction
    icon: { sprite: _Goobstation/Gangs/actions.rsi, state: set_base }
  - type: InstantAction
    event: !type:GangLeaderSummonLockerEvent

- type: entity
  id: ActionGangLeaderMemberOffer
  name: Recruter
  description: Offre une place dans ton gang à quelqu'un. Tu ne peux recruter que trois membres.
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    icon: { sprite: _Goobstation/Gangs/actions.rsi, state: invite }
  - type: TargetAction
    range: 3.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - AntagImmune
    event: !type:GangLeaderMemberOfferEvent
