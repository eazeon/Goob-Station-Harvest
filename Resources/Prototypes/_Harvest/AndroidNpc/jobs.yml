  lines:
    en:
      capabilities:
      - "I cook the kitchen menu: burgers, pizzas, soups, salads, cakes and more. Ask me what I serve."
      break: *breakEn
      backToWork: *backEn
      flee: *fleeEn
      idle:
      - "Kitchen's open."
      - "Who's hungry?"
      - "Order up, anyone?"
      - "The grill is hot."
      despawn: *despawnEn
      preparing:
      - "One {item}, coming right up."
      - "Starting on your {item}, {customer}."
      - "A {item}? Give me a moment."
      served:
      - "Here's your {item}, {customer}. Enjoy!"
      - "Order up: one {item} for {customer}."
      - "{item}, fresh off the grill."
      unknownOrder:
      - "I don't know that dish, so I'll make you a {item} instead."
      - "That's not on my menu. How about a {item}? Coming up."
      - "Never heard of it. You're getting a {item}."
    fr:
      capabilities:
      - "Je prépare les plats de la carte : burgers, pizzas, soupes, salades, gâteaux et plus. Demandez-moi ce que je sers."
      break: *breakFr
      backToWork: *backFr
      flee: *fleeFr
      idle:
      - "La cuisine est ouverte."
      - "Qui a faim ?"
      - "Quelqu'un veut manger ?"
      - "Le grill est chaud."
      despawn: *despawnFr
      preparing:
      - "{item}, ça arrive."
      - "Je commence votre {item}, {customer}."
      - "{item} ? Laissez-moi une minute."
      served:
      - "Voici votre {item}, {customer}. Bon appétit !"
      - "Commande prête : {item} pour {customer}."
      - "{item}, tout droit sorti du grill."
      unknownOrder:
      - "Je ne connais pas ce plat, je vous prépare plutôt : {item}."
      - "Ce n'est pas sur ma carte. Je vous fais {item} à la place."
      - "Jamais entendu parler. Vous aurez : {item}."

