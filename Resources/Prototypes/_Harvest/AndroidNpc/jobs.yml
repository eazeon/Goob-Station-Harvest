- type: androidJob
  id: Janitor
  job: Janitor
  jobTitle: Concierge
  entityPrototype: MobAndroidJanitor
  stationJob: Janitor
  radioChannel: Service
  workBeacon: station-beacon-janitor
  patrolRoute:
  - station-beacon-service
  - station-beacon-medical
  - station-beacon-science
  - station-beacon-engineering
  - station-beacon-janitor
  - station-beacon-command
  resupplyBeacon: station-beacon-janitor
  requiredLoadout:
  - MopItem
  - TrashBag
  - WetFloorSign
  - WetFloorSign
  - WetFloorSign
  - WetFloorSign
  - Bucket
  - CigPackGreen
  - Lighter
  messTags:
  - Puddle
  trashTags:
  - Trash
  - GlassShard
  retaliationWeapon: MopItem
  addressKeywords:
  - android
  - androïde
  lines:
    en:
      capabilities:
      - "I clean puddles and trash, put up wet floor signs, hunt mice and replace broken lights."
      mess:
      - "This is gonna take a while."
      - "Who did this?"
      - "What a mess."
      - "This is awful."
      - "Disgusting."
      - "Look at this filth."
      - "What a fucking mess!"
      - "More work for me!"
      - "Who the fuck did this?"
      - "A bunch of pigs."
      break: &breakEn
      - "Time for a smoke."
      - "Time for a break."
      - "Time for a breather."
      - "Going on break."
      - "My circuits need a breather."
      - "Break time."
      backToWork: &backEn
      - "Back to work..."
      - "Duty calls."
      - "Enough loafing."
      - "Back on the clock."
      - "Back to the grind."
      flee: &fleeEn
      - "Help me!"
      - "Retreating!"
      - "I'm out of here!"
      - "That's too much!"
      - "I can't handle this!"
      - "This is getting out of hand!"
      idle:
      - "Nothing to report."
      - "Quiet shift."
      - "Waiting for work."
      - "No mess, no stress."
      - "All clear here."
      attack:
      - "Take that!"
      - "Got you!"
      - "There!"
      - "Hyah!"
      despawn: &despawnEn
      - "My replacement is here. Heading to cryostorage."
      - "Shift's over for me. Good luck!"
      - "A real crew member? I'll leave you to it."
    fr:
      capabilities:
      - "Je nettoie les flaques et les déchets, je pose des panneaux sol glissant, je chasse les souris et je change les ampoules."
      mess:
      - "Ça va prendre un moment."
      - "Qui a fait ça ?"
      - "Quel bazar."
      - "C'est affreux."
      - "Dégoûtant."
      - "Regardez-moi cette crasse."
      - "Quel putain de bordel !"
      - "Encore du boulot pour moi !"
      - "Mais qui a foutu ce bordel ?"
      - "Une bande de porcs."
      break: &breakFr
      - "C'est l'heure de la clope."
      - "C'est l'heure de la pause."
      - "Un peu d'air, ça ne fait pas de mal."
      - "Je pars en pause."
      - "Mes circuits ont besoin de souffler."
      - "Pause !"
      backToWork: &backFr
      - "Bon, au boulot..."
      - "Le devoir m'appelle."
      - "Assez traîné."
      - "Je reprends le service."
      - "Retour au turbin."
      flee: &fleeFr
      - "À l'aide !"
      - "Je me replie !"
      - "Je me tire d'ici !"
      - "C'en est trop !"
      - "Je ne gère plus !"
      - "Ça devient n'importe quoi !"
      idle:
      - "Rien à signaler."
      - "Service calme."
      - "J'attends du travail."
      - "Pas de saleté, pas de souci."
      - "Tout est propre par ici."
      attack:
      - "Prends ça !"
      - "Je t'ai eu !"
      - "Voilà !"
      - "Hyah !"
      despawn: &despawnFr
      - "Ma relève est arrivée. Je vais en cryostase."
      - "Fin de service pour moi. Bon courage !"
      - "Un vrai membre d'équipage ? Je vous laisse la place."

