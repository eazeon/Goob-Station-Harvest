- type: androidJob
  id: Paramedic
  job: Paramedic
  jobTitle: Paramédic
  entityPrototype: MobAndroidParamedic
  stationJob: Paramedic
  radioChannel: Medical
  workBeacon: station-beacon-medbay
  resupplyBeacon: station-beacon-medical
  patrolRoute:
  - station-beacon-medical
  - station-beacon-service
  - station-beacon-science
  - station-beacon-engineering
  - station-beacon-cargo
  - station-beacon-command
  retaliationWeapon: CrowbarRed
  addressKeywords:
  - android
  - androïde
  lines:
    en:
      capabilities:
      - "I treat the injured with injections, give epinephrine to critical patients and bring them and the dead to medbay. Tell me \"heal me\" or \"someone is hurt at the bar\"."
      break: *breakEn
      backToWork: *backEn
      flee: *fleeEn
      idle:
      - "Everyone feeling alright?"
      - "Medical patrol, nothing to report."
      - "Remember to wear your suit sensors."
      - "Stay safe out there."
      attack:
      - "Stand down!"
      - "Back off!"
      - "Medical override!"
      despawn: *despawnEn
      treating:
      - "Hold still, {patient}, I'm patching you up."
      - "Let me take a look, {patient}."
      - "Treating you now, {patient}."
      treated:
      - "There you go, {patient}. Take it easy."
      - "All patched up, {patient}."
      - "You're good to go, {patient}."
      stabilizing:
      - "Patient critical! Administering epinephrine."
      - "Stay with me, {patient}! Epinephrine going in."
      carrying:
      - "Taking {patient} to medbay."
      - "Moving the patient to medbay, make way!"
    fr:
      capabilities:
      - "Je soigne les blessés par injection, j'injecte de l'épinéphrine aux patients critiques et je les ramène à l'infirmerie, les morts aussi. Dites-moi « soigne-moi » ou « il y a un blessé au bar »."
      break: *breakFr
      backToWork: *backFr
      flee: *fleeFr
      idle:
      - "Tout le monde va bien ?"
      - "Patrouille médicale, rien à signaler."
      - "Pensez à activer vos capteurs de combinaison."
      - "Soyez prudents."
      attack:
      - "Reculez !"
      - "Arrêtez ça !"
      - "Intervention médicale !"
      despawn: *despawnFr
      treating:
      - "Ne bougez pas, {patient}, je vous soigne."
      - "Laissez-moi regarder ça, {patient}."
      - "Je m'occupe de vous, {patient}."
      treated:
      - "Voilà, {patient}. Ménagez-vous."
      - "C'est réparé, {patient}."
      - "Vous pouvez y aller, {patient}."
      stabilizing:
      - "Patient critique ! J'injecte de l'épinéphrine."
      - "Restez avec moi, {patient} ! Épinéphrine."
      carrying:
      - "J'emmène {patient} à l'infirmerie."
      - "Patient en transfert vers l'infirmerie, laissez passer !"
