- type: entity
  parent: [ ClothingNeckBase, BaseSyndicateContraband ] # TODO: Make it ClothingNeckUnbutcherableBase once upstream happens
  id: ClothingNeckBombCollar
  name: collier explosif
  description: Un collier explosif, il explose.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Trauma/Clothing/Neck/bombcollar.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Neck/bombcollar.rsi
    stripDelay: 10
    equipDelay: 5
  - type: SelfUnremovableClothing
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Minibomb
    maxIntensity: 50
    intensitySlope: 20
    totalIntensity: 100
    canCreateVacuum: false
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger

- type: entity
  parent: [ ClothingNeckBase, SurveillanceWirelessCameraBodyEntertainment, BaseSyndicateContraband ] # TODO: Make it ClothingNeckUnbutcherableBase once upstream happens
  id: ClothingNeckSlayerCoat
  name: veste S.L.A.Y.E.R.
  description: La Syndicate Lightly Armored Yet Explosive Resistant Overcoat, ou veste S.L.A.Y.E.R. en abrégé, est la seule veste des Maraudeurs Gorlex capable de protéger les membres du porteur des dégâts explosifs, s'il est porté sur les épaules. Son intérieur est garni de crochets. Il est doté d'une technologie exclusive lui permettant de se connecter aux systèmes Nanotrasen comme une caméra. Déconseillé aux âmes sensibles. Utilisé pour divertir et distraire l'équipage pendant que vous faites ce qui doit être fait.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Trauma/Clothing/Neck/slayer_coat.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Neck/slayer_coat.rsi
  - type: SelfUnremovableClothing
  - type: FactionClothing
    faction: Syndicate
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    - Hand
    - Leg
    - Foot
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: SurveillanceCamera
    id: Slayer
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: RadioShow
    listenRange: 1
    enabled: false
    toggleOnInteract: true
    unobstructedRequired: true
