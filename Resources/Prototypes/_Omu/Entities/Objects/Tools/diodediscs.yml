- type: entity
  abstract: true
  parent: BaseItem
  id: BaseDiodeDisc
  components:
  - type: Sprite
    sprite: _Omu/Objects/Tools/diodedisc.rsi
    state: icon
  - type: DiodeDisc

- type: entity
  parent: BaseDiodeDisc
  id: DiodeDiscElectroDisruptive
  name: Disque-diode Électro-Disruptif
  description: Un disque-diode pour utilisation dans un émetteur, celui-ci déclenchera un événement de rectification de causalité dans une supermatière, la réparant.
  components:
  - type: DiodeDisc
    newBolt: EmitterBoltElectroDisruptive
    componentsToAdd:
    - type: UpgradedMachine
      upgrade: emitter-electro-disrutpive

- type: entity
  parent: BaseDiodeDisc
  id: DiodeDiscElectroBehavioural
  name: Disque-diode Électro-Comportemental
  description: Un disque-diode pour utilisation dans un émetteur, celui-ci déclenchera un événement de causalité en cascade dans une supermatière, causant des dégâts mais augmentant significativement la production d'énergie. Il a aussi un effet positif sur la santé des patients !
  components:
  - type: DiodeDisc
    newBolt: EmitterBoltElectroBehavioural
    componentsToAdd:
    - type: UpgradedMachine
      upgrade: emitter-electro-behavioural

- type: entity
  name: projectile d'émetteur
  id: EmitterBoltElectroDisruptive
  parent: EmitterBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - EmitterBolt
  - type: Projectile
    damage:
      types:
        Heat: 14
        Blunt: 6
  - type: AngeringProjectile
    integDamage: -1
    energyDamage: -60

- type: entity
  name: projectile d'émetteur
  id: EmitterBoltElectroBehavioural
  parent: EmitterBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - EmitterBolt
  - type: Projectile
    damage:
      types:
        Heat: -5
        Blunt: -2
  - type: AngeringProjectile
    integDamage: 1
    energyDamage: 100
