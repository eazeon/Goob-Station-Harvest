- type: entity
  parent: BaseHealingItem
  id: SynthBloodpack
  name: pack de sang synth
  suffix: Full
  description: Contient du fullerène, une solution sanguine synthétique à base de carbone utilisée par les Synths.
  components:
  - type: Item
    sprite: _Afterlight/Objects/Specific/Medical/medical.rsi
    heldPrefix: synthpack
  - type: Tag
    tags:
    - Bloodpack
  - type: Sprite
    sprite: _Afterlight/Objects/Specific/Medical/medical.rsi
    state: synthpack
  - type: Healing
    damageContainers:
    - Biological
    damage:
      types:
        Bloodloss: -0.5
    delay: 1.6
    modifyBloodLevel: -15
    healingBeginSound:
      path: /Audio/Items/Medical/brutepack_begin.ogg
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: /Audio/Items/Medical/brutepack_end.ogg
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: SynthBloodpack
    count: 10
  - type: StackPrice
    price: 10

- type: entity
  parent: SynthBloodpack
